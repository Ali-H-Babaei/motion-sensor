<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Floor Plan Temperature View</title>
</head>
<body>
    <div class="controls" id="controls">
        <button onclick="window.location.href='home.html'" style="background-color: #4CAF50; color: white;">Back to Editor</button>
        <select id="layoutSelect">
            <option value="">Select a layout...</option>
        </select>
        <button onclick="loadFromServer()">Load Layout</button>
        <button onclick="editSensorMapping()">Edit Sensor Mapping</button>
        <button onclick="toggleFullscreen()" id="fullscreenBtn">Enter Fullscreen</button>
        <div class="temp-scale">
            <div class="temp-scale-item" style="background-color: #0000ff;"></div>
            <span class="temp-scale-label">Cold (15°C)</span>
            <div class="temp-scale-item" style="background-color: #00ff00;"></div>
            <span class="temp-scale-label">Comfortable (22°C)</span>
            <div class="temp-scale-item" style="background-color: #ff0000;"></div>
            <span class="temp-scale-label">Hot (30°C)</span>
        </div>
    </div>

    <div class="fullscreen-header" id="fullscreenHeader" style="display: none;">
        <div class="outside-temp-display">
            <span class="outside-temp-label">Outside</span>
            <span id="outsideTemp" class="outside-temp-value">--°C</span>
        </div>
        <button onclick="toggleFullscreen()" class="exit-fullscreen-btn">✕</button>
    </div>

    <div id="mappingModal" class="modal">
        <div class="modal-content">
            <h2>Sensor Mapping</h2>
            <div id="mappingContainer"></div>
            <button onclick="saveSensorMapping()">Save</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <div class="floor-plan" id="floorPlan"></div>

    <script>
        let temperatures = {};
        let sensorMapping = {};
        let outsideTemperature = null;
        let isFullscreen = false;
        
        async function loadSensorMapping() {
            try {
                const response = await fetch('/api/sensor-mapping');
                sensorMapping = await response.json();
            } catch (error) {
                console.error('Error loading sensor mapping:', error);
            }
        }

        async function updateTemperatures() {
            try {
                const response = await fetch('/api/temperatures');
                const sensorData = await response.json();
                
                // Check for Porch sensor and update background
                let porchTemp = null;
                for (const [sensorId, data] of Object.entries(sensorData)) {
                    if (data.name && data.name.toLowerCase().includes('porch')) {
                        porchTemp = data.temperature;
                        outsideTemperature = porchTemp;
                        updateBackgroundColor(porchTemp);
                        updateOutsideDisplay(porchTemp);
                        break;
                    }
                }
                
                // If no porch sensor found, check for any sensor with "outside" in the name
                if (porchTemp === null) {
                    for (const [sensorId, data] of Object.entries(sensorData)) {
                        if (data.name && data.name.toLowerCase().includes('outside')) {
                            porchTemp = data.temperature;
                            outsideTemperature = porchTemp;
                            updateBackgroundColor(porchTemp);
                            updateOutsideDisplay(porchTemp);
                            break;
                        }
                    }
                }
                
                // First set all rooms to grey (unmapped state)
                document.querySelectorAll('.room').forEach(room => {
                    const tempElement = room.querySelector('span');
                    if (tempElement) {
                        room.style.backgroundColor = '#cccccc';
                        tempElement.textContent = 'No sensor';
                    }
                });
                
                // Then update only mapped rooms
                for (const [roomTempId, sensorId] of Object.entries(sensorMapping.mappings)) {
                    if (!sensorId) continue; // Skip rooms mapped to "no sensor"
                    if (sensorData[sensorId]) {
                        temperatures[roomTempId] = sensorData[sensorId].temperature;
                        const room = document.querySelector(`#${roomTempId}`).parentElement;
                        const tempElement = document.getElementById(roomTempId);
                        if (!room || !tempElement) continue;

                        room.style.backgroundColor = getTemperatureColor(temperatures[roomTempId]);
                        tempElement.textContent = `${temperatures[roomTempId].toFixed(1)}°C`;
                    }
                }
            } catch (error) {
                console.error('Error updating temperatures:', error);
            }
        }

        function updateBackgroundColor(temperature) {
            const color = getTemperatureColor(temperature);
            // Apply a more prominent version of the temperature color to the background
            const rgb = color.match(/\d+/g);
            if (rgb) {
                const [r, g, b] = rgb;
                // Create a more visible gradient that still maintains readability
                if (isFullscreen) {
                    // Much more prominent background in fullscreen for wall display
                    document.body.style.background = `linear-gradient(135deg, rgba(${r}, ${g}, ${b}, 0.4) 0%, rgba(${Math.max(0, r-20)}, ${Math.max(0, g-20)}, ${Math.max(0, b-20)}, 0.6) 50%, rgba(${Math.max(0, r-40)}, ${Math.max(0, g-40)}, ${Math.max(0, b-40)}, 0.8) 100%)`;
                } else {
                    document.body.style.background = `linear-gradient(135deg, rgba(${r}, ${g}, ${b}, 0.2) 0%, rgba(${Math.max(0, r-50)}, ${Math.max(0, g-50)}, ${Math.max(0, b-50)}, 0.4) 100%)`;
                }
            }
        }

        function updateOutsideDisplay(temperature) {
            const outsideTempElement = document.getElementById('outsideTemp');
            if (outsideTempElement) {
                outsideTempElement.textContent = `${temperature.toFixed(1)}°C`;
                outsideTempElement.style.color = getTemperatureColor(temperature);
            }
        }

        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            const controls = document.getElementById('controls');
            const fullscreenHeader = document.getElementById('fullscreenHeader');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const body = document.body;
            
            if (isFullscreen) {
                body.classList.add('fullscreen-mode');
                controls.style.display = 'none';
                fullscreenHeader.style.display = 'flex';
                fullscreenBtn.textContent = 'Exit Fullscreen';
                
                // Update background color intensity for fullscreen
                if (outsideTemperature !== null) {
                    updateBackgroundColor(outsideTemperature);
                }
            } else {
                body.classList.remove('fullscreen-mode');
                controls.style.display = 'flex';
                fullscreenHeader.style.display = 'none';
                fullscreenBtn.textContent = 'Enter Fullscreen';
                
                // Update background color intensity for normal mode
                if (outsideTemperature !== null) {
                    updateBackgroundColor(outsideTemperature);
                }
            }
        }

        function editSensorMapping() {
            const modal = document.getElementById('mappingModal');
            const container = document.getElementById('mappingContainer');
            container.innerHTML = '';
            
            document.querySelectorAll('.room').forEach(room => {
                const tempId = room.querySelector('span').id;
                const select = document.createElement('select');
                select.dataset.roomId = tempId;
                
                // Add no sensor option
                select.innerHTML = `
                    <option value="">No sensor</option>
                    <option value="" disabled>──────────</option>
                `;
                
                // Add sensor options (fetch from current temperature data)
                fetch('/api/temperatures')
                    .then(response => response.json())
                    .then(sensors => {
                        Object.entries(sensors).forEach(([sensorId, data]) => {
                            const option = document.createElement('option');
                            option.value = sensorId;
                            option.textContent = data.name;
                            option.selected = sensorMapping.mappings[tempId] === sensorId;
                            select.appendChild(option);
                        });
                        // Set "No sensor" as selected if no mapping exists
                        if (!sensorMapping.mappings[tempId]) {
                            select.value = "";
                        }
                    });

                const div = document.createElement('div');
                div.innerHTML = `<label>${room.textContent.split('\n')[0]}: </label>`;
                div.appendChild(select);
                container.appendChild(div);
            });
            
            modal.style.display = 'block';
        }

        async function saveSensorMapping() {
            const mappings = {};
            document.querySelectorAll('#mappingContainer select').forEach(select => {
                if (select.value) {
                    mappings[select.dataset.roomId] = select.value;
                }
            });
            
            try {
                await fetch('/api/sensor-mapping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mappings })
                });
                sensorMapping = { mappings };
                closeModal();
            } catch (error) {
                console.error('Error saving mapping:', error);
            }
        }

        function closeModal() {
            document.getElementById('mappingModal').style.display = 'none';
        }

        function getTemperatureColor(temp) {
            // Convert temperature to a color between blue (cold) and red (hot)
            const minTemp = 15;  // Blue
            const maxTemp = 30;  // Red
            const normalized = Math.max(0, Math.min(1, (temp - minTemp) / (maxTemp - minTemp)));
            
            if (normalized <= 0.5) {
                // Blue to Green
                const intensity = Math.floor((normalized * 2) * 255);
                return `rgb(0, ${intensity}, ${255 - intensity})`;
            } else {
                // Green to Red
                const intensity = Math.floor(((normalized - 0.5) * 2) * 255);
                return `rgb(${intensity}, ${255 - intensity}, 0)`;
            }
        }

        // Add viewer class to newly created rooms
        function createRoom(roomData) {
            const room = document.createElement('div');
            room.className = 'room viewer';
            room.style.left = roomData.left;
            room.style.top = roomData.top;
            room.style.width = roomData.width;
            room.style.height = roomData.height;
            
            room.textContent = roomData.name;
            
            const tempSpan = document.createElement('span');
            tempSpan.id = roomData.tempId;
            tempSpan.textContent = '20°C';
            room.appendChild(tempSpan);
            
            return room;
        }

        async function updateLayoutList() {
            try {
                const response = await fetch('/api/layouts');
                const files = await response.json();
                const select = document.getElementById('layoutSelect');
                select.innerHTML = '<option value="">Select a layout...</option>';
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    select.appendChild(option);
                });

                // Auto-load most recent layout
                if (files.length > 0) {
                    const latestFile = files[files.length - 1];
                    select.value = latestFile;
                    loadFromServer();
                }
            } catch (error) {
                console.error('Error loading layout list:', error);
            }
        }

        async function loadFromServer() {
            const filename = document.getElementById('layoutSelect').value;
            if (!filename) return;

            try {
                const response = await fetch(`/api/load/${filename}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const layout = Array.isArray(data) ? data : [];
                
                document.getElementById('floorPlan').innerHTML = '';
                temperatures = {};

                if (layout.length === 0) {
                    return;
                }

                layout.forEach(roomData => {
                    if (roomData && typeof roomData === 'object') {
                        const room = createRoom(roomData);
                        document.getElementById('floorPlan').appendChild(room);
                        temperatures[roomData.tempId] = 20;
                    }
                });
            } catch (error) {
                alert('Error loading layout: ' + error.message);
            }
        }

        // Replace the temperature simulation interval with real data updates
        setInterval(updateTemperatures, 1000);

        // Load layout list when page loads
        updateLayoutList();

        // Load sensor mapping when page loads
        loadSensorMapping();

        // Keyboard shortcut for fullscreen (F11 or F)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11' || e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            }
            if (e.key === 'Escape' && isFullscreen) {
                toggleFullscreen();
            }
        });
    </script>

    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            z-index: 1001;
            border-radius: 12px;
        }
        #mappingContainer div {
            margin: 10px 0;
        }
        select option[disabled] {
            color: #999;
            background-color: #eee;
        }

        /* Fullscreen Mode Styles */
        .fullscreen-mode {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .fullscreen-mode .floor-plan {
            margin: 0;
            border-radius: 0;
            height: 100vh;
            box-shadow: none;
            border: none;
            background: rgba(255, 255, 255, 0.7); /* Reduced opacity to show background better */
        }

        .fullscreen-mode .room.viewer {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 1.2rem;
            border-width: 4px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.85) !important; /* Ensure room backgrounds are semi-transparent */
        }

        .fullscreen-mode .room.viewer span {
            font-size: 1.6rem;
            font-weight: 900;
            margin-top: 0.6rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            color: #1f2937; /* Darker text for better contrast */
        }

        .fullscreen-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .fullscreen-mode .fullscreen-header {
            display: flex !important;
        }

        .outside-temp-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 1.2rem 2rem;
            border-radius: 15px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
            border: 4px solid rgba(255, 255, 255, 0.6);
        }

        .outside-temp-label {
            font-size: 1rem;
            font-weight: 700;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.4rem;
        }

        .outside-temp-value {
            font-size: 2.5rem;
            font-weight: 900;
            transition: color 0.3s ease;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .exit-fullscreen-btn {
            background: rgba(239, 68, 68, 0.95);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .exit-fullscreen-btn:hover {
            background: rgba(220, 38, 38, 1);
            transform: scale(1.15);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        }

        /* Adjust floor plan padding in fullscreen */
        .fullscreen-mode .floor-plan {
            padding-top: 120px; /* Account for larger fullscreen header */
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 20px;
        }

        /* Enhanced room visibility in fullscreen */
        .fullscreen-mode .room.viewer {
            border: 4px solid rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .fullscreen-mode .room.viewer:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 1);
        }

        /* Override room background colors in fullscreen to be semi-transparent */
        .fullscreen-mode .room.viewer[style*="background-color"] {
            background-blend-mode: multiply;
        }

        /* Hide scrollbars in fullscreen */
        .fullscreen-mode::-webkit-scrollbar {
            display: none;
        }

        .fullscreen-mode {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Make fullscreen button more prominent */
        #fullscreenBtn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        #fullscreenBtn:hover {
            background: #5b5bf6;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.4);
        }
    </style>
</body>
</html>
