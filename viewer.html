<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Floor Plan Temperature View</title>
</head>
<body>
    <div class="controls">
        <button onclick="window.location.href='home.html'" style="background-color: #4CAF50; color: white;">Back to Editor</button>
        <select id="layoutSelect">
            <option value="">Select a layout...</option>
        </select>
        <button onclick="loadFromServer()">Load Layout</button>
        <button onclick="editSensorMapping()">Edit Sensor Mapping</button>
        <div class="temp-scale">
            <div class="temp-scale-item" style="background-color: #0000ff;"></div>
            <span class="temp-scale-label">Cold (15°C)</span>
            <div class="temp-scale-item" style="background-color: #00ff00;"></div>
            <span class="temp-scale-label">Comfortable (22°C)</span>
            <div class="temp-scale-item" style="background-color: #ff0000;"></div>
            <span class="temp-scale-label">Hot (30°C)</span>
        </div>
    </div>

    <div id="mappingModal" class="modal">
        <div class="modal-content">
            <h2>Sensor Mapping</h2>
            <div id="mappingContainer"></div>
            <button onclick="saveSensorMapping()">Save</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <div class="floor-plan" id="floorPlan"></div>

    <script>
        let temperatures = {};
        let sensorMapping = {};
        
        async function loadSensorMapping() {
            try {
                const response = await fetch('/api/sensor-mapping');
                sensorMapping = await response.json();
            } catch (error) {
                console.error('Error loading sensor mapping:', error);
            }
        }

        async function updateTemperatures() {
            try {
                const response = await fetch('/api/temperatures');
                const sensorData = await response.json();
                
                // First set all rooms to grey (unmapped state)
                document.querySelectorAll('.room').forEach(room => {
                    const tempElement = room.querySelector('span');
                    if (tempElement) {
                        room.style.backgroundColor = '#cccccc';
                        tempElement.textContent = 'No sensor';
                    }
                });
                
                // Then update only mapped rooms
                for (const [roomTempId, sensorId] of Object.entries(sensorMapping.mappings)) {
                    if (!sensorId) continue; // Skip rooms mapped to "no sensor"
                    if (sensorData[sensorId]) {
                        temperatures[roomTempId] = sensorData[sensorId].temperature;
                        const room = document.querySelector(`#${roomTempId}`).parentElement;
                        const tempElement = document.getElementById(roomTempId);
                        if (!room || !tempElement) continue;

                        room.style.backgroundColor = getTemperatureColor(temperatures[roomTempId]);
                        tempElement.textContent = `${temperatures[roomTempId].toFixed(1)}°C`;
                    }
                }
            } catch (error) {
                console.error('Error updating temperatures:', error);
            }
        }

        function editSensorMapping() {
            const modal = document.getElementById('mappingModal');
            const container = document.getElementById('mappingContainer');
            container.innerHTML = '';
            
            document.querySelectorAll('.room').forEach(room => {
                const tempId = room.querySelector('span').id;
                const select = document.createElement('select');
                select.dataset.roomId = tempId;
                
                // Add no sensor option
                select.innerHTML = `
                    <option value="">No sensor</option>
                    <option value="" disabled>──────────</option>
                `;
                
                // Add sensor options (fetch from current temperature data)
                fetch('/api/temperatures')
                    .then(response => response.json())
                    .then(sensors => {
                        Object.entries(sensors).forEach(([sensorId, data]) => {
                            const option = document.createElement('option');
                            option.value = sensorId;
                            option.textContent = data.name;
                            option.selected = sensorMapping.mappings[tempId] === sensorId;
                            select.appendChild(option);
                        });
                        // Set "No sensor" as selected if no mapping exists
                        if (!sensorMapping.mappings[tempId]) {
                            select.value = "";
                        }
                    });

                const div = document.createElement('div');
                div.innerHTML = `<label>${room.textContent.split('\n')[0]}: </label>`;
                div.appendChild(select);
                container.appendChild(div);
            });
            
            modal.style.display = 'block';
        }

        async function saveSensorMapping() {
            const mappings = {};
            document.querySelectorAll('#mappingContainer select').forEach(select => {
                if (select.value) {
                    mappings[select.dataset.roomId] = select.value;
                }
            });
            
            try {
                await fetch('/api/sensor-mapping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mappings })
                });
                sensorMapping = { mappings };
                closeModal();
            } catch (error) {
                console.error('Error saving mapping:', error);
            }
        }

        function closeModal() {
            document.getElementById('mappingModal').style.display = 'none';
        }

        function getTemperatureColor(temp) {
            // Convert temperature to a color between blue (cold) and red (hot)
            const minTemp = 15;  // Blue
            const maxTemp = 30;  // Red
            const normalized = (temp - minTemp) / (maxTemp - minTemp);
            
            if (normalized <= 0.5) {
                // Blue to Green
                const intensity = Math.floor((normalized * 2) * 255);
                return `rgb(0, ${intensity}, ${255 - intensity})`;
            } else {
                // Green to Red
                const intensity = Math.floor(((normalized - 0.5) * 2) * 255);
                return `rgb(${intensity}, ${255 - intensity}, 0)`;
            }
        }

        // Add viewer class to newly created rooms
        function createRoom(roomData) {
            const room = document.createElement('div');
            room.className = 'room viewer';
            room.style.left = roomData.left;
            room.style.top = roomData.top;
            room.style.width = roomData.width;
            room.style.height = roomData.height;
            
            room.textContent = roomData.name;
            
            const tempSpan = document.createElement('span');
            tempSpan.id = roomData.tempId;
            tempSpan.textContent = '20°C';
            room.appendChild(tempSpan);
            
            return room;
        }

        async function updateLayoutList() {
            try {
                const response = await fetch('/api/layouts');
                const files = await response.json();
                const select = document.getElementById('layoutSelect');
                select.innerHTML = '<option value="">Select a layout...</option>';
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file;
                    option.textContent = file;
                    select.appendChild(option);
                });

                // Auto-load most recent layout
                if (files.length > 0) {
                    const latestFile = files[files.length - 1];
                    select.value = latestFile;
                    loadFromServer();
                }
            } catch (error) {
                console.error('Error loading layout list:', error);
            }
        }

        async function loadFromServer() {
            const filename = document.getElementById('layoutSelect').value;
            if (!filename) return;

            try {
                const response = await fetch(`/api/load/${filename}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const layout = Array.isArray(data) ? data : [];
                
                document.getElementById('floorPlan').innerHTML = '';
                temperatures = {};

                if (layout.length === 0) {
                    return;
                }

                layout.forEach(roomData => {
                    if (roomData && typeof roomData === 'object') {
                        const room = createRoom(roomData);
                        document.getElementById('floorPlan').appendChild(room);
                        temperatures[roomData.tempId] = 20;
                    }
                });
            } catch (error) {
                alert('Error loading layout: ' + error.message);
            }
        }

        // Replace the temperature simulation interval with real data updates
        setInterval(updateTemperatures, 1000);

        // Load layout list when page loads
        updateLayoutList();

        // Load sensor mapping when page loads
        loadSensorMapping();
    </script>

    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000; /* Add this line */
        }
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            z-index: 1001; /* Add this line */
        }
        #mappingContainer div {
            margin: 10px 0;
        }
        select option[disabled] {
            color: #999;
            background-color: #eee;
        }
    </style>
</body>
</html>
