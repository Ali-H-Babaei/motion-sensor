<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Floor Plan Designer</title>
</head>
<body>
    <div class="controls">
        <div class="new-room-form">
            <input type="text" id="roomName" placeholder="Room name">
            <button onclick="addNewRoom()">Add Room</button>
            <button onclick="saveToServer()">Save Layout</button>
            <select id="layoutSelect">
                <option value="">Select a layout...</option>
            </select>
            <button onclick="loadFromServer()">Load Layout</button>
            <button onclick="window.location.href='viewer.html'" style="margin-left: auto; background-color: #4CAF50; color: white;">View Temperature Map</button>
        </div>
    </div>

    <div class="floor-plan editor" id="floorPlan">
        <!-- Template for new rooms -->
        <template id="roomTemplate">
            <div class="room editor" style="left: 10px; top: 10px; width: 150px; height: 100px;">
                <button class="delete-button" onclick="deleteRoom(this.parentElement)">✕</button>
                <span class="temp"></span>
                <div class="resize-handle nw"></div>
                <div class="resize-handle ne"></div>
                <div class="resize-handle sw"></div>
                <div class="resize-handle se"></div>
            </div>
        </template>
    </div>

  <script>
    // Add grid constants
    const GRID_SIZE = 20;

    // Helper function to snap value to grid
    function snapToGrid(value) {
      return Math.round(value / GRID_SIZE) * GRID_SIZE;
    }

    let isDragging = false;
    let isResizing = false;
    let currentElement = null;
    let initialX, initialY, initialLeft, initialTop, initialWidth, initialHeight;
    let activeHandle = null; // Add this new variable

    document.querySelectorAll('.room').forEach(room => {
      room.addEventListener('mousedown', startDragOrResize);
      room.querySelectorAll('.resize-handle').forEach(handle => {
        handle.addEventListener('mousedown', (e) => startResize(e, handle));
      });
    });

    function startDragOrResize(e) {
      if (e.target.classList.contains('resize-handle') || e.target.classList.contains('delete-button')) return;
      
      isDragging = true;
      currentElement = this;
      initialX = e.clientX;
      initialY = e.clientY;
      initialLeft = snapToGrid(this.offsetLeft);
      initialTop = snapToGrid(this.offsetTop);
      
      this.classList.add('dragging');
    }

    function startResize(e, handle) {
        e.preventDefault();
        e.stopPropagation();
        isResizing = true;
        activeHandle = handle;
        currentElement = handle.parentElement;
        initialX = e.clientX;
        initialY = e.clientY;
        initialWidth = currentElement.offsetWidth;
        initialHeight = currentElement.offsetHeight;
        initialLeft = currentElement.offsetLeft;
        initialTop = currentElement.offsetTop;
    }

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.clientX - initialX;
        const dy = e.clientY - initialY;
        
        const newLeft = snapToGrid(initialLeft + dx);
        const newTop = snapToGrid(initialTop + dy);
        
        currentElement.style.left = `${newLeft}px`;
        currentElement.style.top = `${newTop}px`;
      }
      else if (isResizing && activeHandle) {
        const dx = e.clientX - initialX;
        const dy = e.clientY - initialY;
        
        let newWidth = initialWidth;
        let newHeight = initialHeight;
        let newLeft = initialLeft;
        let newTop = initialTop;

        if (activeHandle.classList.contains('nw')) {
            newWidth = initialWidth - dx;
            newHeight = initialHeight - dy;
            newLeft = initialLeft + dx;
            newTop = initialTop + dy;
        } else if (activeHandle.classList.contains('ne')) {
            newWidth = initialWidth + dx;
            newHeight = initialHeight - dy;
            newTop = initialTop + dy;
        } else if (activeHandle.classList.contains('sw')) {
            newWidth = initialWidth - dx;
            newHeight = initialHeight + dy;
            newLeft = initialLeft + dx;
        } else if (activeHandle.classList.contains('se')) {
            newWidth = initialWidth + dx;
            newHeight = initialHeight + dy;
        }

        // Snap to grid and ensure minimum size
        newWidth = snapToGrid(Math.max(100, newWidth));
        newHeight = snapToGrid(Math.max(80, newHeight));
        newLeft = snapToGrid(newLeft);
        newTop = snapToGrid(newTop);

        currentElement.style.width = `${newWidth}px`;
        currentElement.style.height = `${newHeight}px`;
        currentElement.style.left = `${newLeft}px`;
        currentElement.style.top = `${newTop}px`;
      }
    });

    document.addEventListener('mouseup', () => {
      if (currentElement && isDragging) {
        currentElement.classList.remove('dragging');
      }
      isDragging = false;
      isResizing = false;
      currentElement = null;
      activeHandle = null;
    });

    // Example of temperature updates
    let temperatures = {
      "temp-entry": 22,
      "temp-bed1": 23,
      "temp-ensuite": 24,
      "temp-bath": 20,
      "temp-bed2": 21,
      "temp-bed3": 19,
      "temp-living": 25,
      "temp-dining": 22,
      "temp-kitchen": 23,
      "temp-laundry": 19
    };

    // Function to update temperature values and animate
    function updateTemperatures() {
      for (const [id, newTemp] of Object.entries(temperatures)) {
        const tempElement = document.getElementById(id);
        if (!tempElement) continue; // Skip if element doesn't exist

        // Add animation class
        tempElement.classList.add('update');

        // Update the text content
        tempElement.textContent = `${newTemp}°C`;

        // Remove the animation class after the transition
        setTimeout(() => {
          if (tempElement) { // Check if element still exists
            tempElement.classList.remove('update');
          }
        }, 300); // Match the transition duration in CSS
      }
    }

    // Simulate periodic updates
    setInterval(() => {
      // Randomize temperatures for demonstration
      for (const id in temperatures) {
        temperatures[id] = Math.floor(Math.random() * 10) + 18; // Random temp between 18 and 27
      }
      updateTemperatures();
    }, 5000); // Update every 5 seconds

    function addNewRoom() {
        const roomName = document.getElementById('roomName').value.trim();
        if (!roomName) return;

        const template = document.getElementById('roomTemplate');
        const newRoom = template.content.cloneNode(true).children[0];
        
        // Snap initial position to grid
        newRoom.style.left = `${snapToGrid(10)}px`;
        newRoom.style.top = `${snapToGrid(10)}px`;
        newRoom.style.width = `${snapToGrid(150)}px`;
        newRoom.style.height = `${snapToGrid(100)}px`;

        // Set room name and create temperature span
        newRoom.insertBefore(document.createTextNode(roomName), newRoom.firstChild);
        const tempSpan = newRoom.querySelector('.temp');
        const tempId = `temp-${roomName.toLowerCase().replace(/\s+/g, '-')}`;
        tempSpan.id = tempId;
        tempSpan.textContent = '20°C';

        // Add to temperature monitoring
        temperatures[tempId] = 20;

        // Add drag and resize listeners
        newRoom.addEventListener('mousedown', startDragOrResize);
        newRoom.querySelectorAll('.resize-handle').forEach(handle => {
            handle.addEventListener('mousedown', (e) => startResize(e, handle));
        });

        document.getElementById('floorPlan').appendChild(newRoom);
        document.getElementById('roomName').value = '';
    }

    function deleteRoom(room) {
        const tempSpan = room.querySelector('span');
        delete temperatures[tempSpan.id];
        room.remove();
    }

    async function saveToServer() {
        const layout = [];
        document.querySelectorAll('.room').forEach(room => {
            layout.push({
                name: room.childNodes[0].textContent,
                tempId: room.querySelector('span').id,
                left: room.style.left,
                top: room.style.top,
                width: room.style.width,
                height: room.style.height
            });
        });

        try {
            const response = await fetch('/api/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(layout)
            });
            const result = await response.json();
            if (result.success) {
                alert('Layout saved successfully!');
                updateLayoutList();
            }
        } catch (error) {
            console.error('Error saving layout:', error);
            alert('Error saving layout');
        }
    }

    async function updateLayoutList() {
        try {
            const response = await fetch('/api/layouts');
            const files = await response.json();
            const select = document.getElementById('layoutSelect');
            select.innerHTML = '<option value="">Select a layout...</option>';
            files.forEach(file => {
                const option = document.createElement('option');
                option.value = file;
                option.textContent = file;
                select.appendChild(option);
            });

            // Auto-load most recent layout
            if (files.length > 0) {
                const latestFile = files[files.length - 1];
                select.value = latestFile;
                loadFromServer();
            }
        } catch (error) {
            console.error('Error loading layout list:', error);
        }
    }

    async function loadFromServer() {
        const filename = document.getElementById('layoutSelect').value;
        if (!filename) return;

        try {
            const response = await fetch(`/api/load/${filename}`);
            const layout = await response.json();
            
            // Clear existing rooms
            document.querySelectorAll('.room').forEach(room => room.remove());
            temperatures = {};

            // Use existing room creation logic
            layout.forEach(roomData => {
                const template = document.getElementById('roomTemplate');
                const newRoom = template.content.cloneNode(true).children[0];
                
                newRoom.insertBefore(document.createTextNode(roomData.name), newRoom.firstChild);
                const tempSpan = newRoom.querySelector('.temp');
                tempSpan.id = roomData.tempId;
                tempSpan.textContent = '20°C';

                newRoom.style.left = roomData.left;
                newRoom.style.top = roomData.top;
                newRoom.style.width = roomData.width;
                newRoom.style.height = roomData.height;

                temperatures[roomData.tempId] = 20;

                newRoom.addEventListener('mousedown', startDragOrResize);
                newRoom.querySelectorAll('.resize-handle').forEach(handle => {
                    handle.addEventListener('mousedown', (e) => startResize(e, handle));
                });

                document.getElementById('floorPlan').appendChild(newRoom);
            });
        } catch (error) {
            console.error('Error loading layout:', error);
            alert('Error loading layout');
        }
    }

    // Load layout list when page loads
    updateLayoutList();
  </script>
</body>
</html>
